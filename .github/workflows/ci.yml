# ============================================================
# CI/CD Pipeline — AMLO (Backend + Frontend)
# ============================================================
name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend'
      - 'backend/**'
      - 'frontend'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend'
      - 'backend/**'
      - 'frontend'
      - 'frontend/**'

jobs:
  # ══════════════════════════════════════════════════════════
  # BACKEND
  # ══════════════════════════════════════════════════════════
  backend-lint-and-typecheck:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@dummy:5432/dummy

      - name: TypeScript check
        run: npx tsc --noEmit

  backend-test:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  backend-build:
    name: Backend — Build & Docker
    runs-on: ubuntu-latest
    needs: [backend-lint-and-typecheck, backend-test]
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@dummy:5432/dummy

      - name: Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: amlo-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════════════════════
  # FRONTEND
  # ══════════════════════════════════════════════════════════
  frontend-quality:
    name: Frontend — Lint, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint . --max-warnings 100

      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build
        run: npm run build

  # E2E ต้องมี backend + database จริง — เปิด stack ด้วย docker compose
  frontend-e2e:
    name: Frontend — E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend-quality]
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start backend + database
        working-directory: .
        run: |
          cp .env.example .env
          cat >> .env <<'EOF'
          DB_PASSWORD=ci-db-password
          JWT_SECRET=ci-jwt-secret-that-is-long-enough-for-production-checks
          MASTER_KEY=ci-master-key
          REDIS_PASSWORD=ci-redis-password
          API_RATE_LIMIT_MAX=20000
          LOGIN_RATE_LIMIT_MAX=500
          VERIFY_RATE_LIMIT_MAX=500
          EOF
          docker compose up -d --build backend postgres redis
          echo "รอ backend พร้อม..."
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "backend พร้อม"
              break
            fi
            sleep 2
          done

      - name: Seed test users
        working-directory: .
        run: docker compose exec -T backend npm run seed || true

      - name: Start Vite dev server
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          echo "รอ Vite พร้อม..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5173/ >/dev/null 2>&1; then
              echo "Vite พร้อม"
              break
            fi
            sleep 2
          done

      - name: Run E2E tests
        run: npx playwright test --config=e2e/playwright.config.ts
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_ADMIN_TOTP_SECRET: ${{ secrets.E2E_ADMIN_TOTP_SECRET }}
          E2E_SUPERVISOR_EMAIL: ${{ secrets.E2E_SUPERVISOR_EMAIL }}
          E2E_SUPERVISOR_PASSWORD: ${{ secrets.E2E_SUPERVISOR_PASSWORD }}
          E2E_SUPERVISOR_TOTP_SECRET: ${{ secrets.E2E_SUPERVISOR_TOTP_SECRET }}
          E2E_HEALTH_URL: http://127.0.0.1:8080/health

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Stop stack
        if: always()
        working-directory: .
        run: docker compose down -v
