# ============================================================
# ZAP Baseline Rules — AMLO Website
# ใช้กับ: docker run --rm -v "$PWD:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
#           zap-baseline.py -t http://host.docker.internal/ -c zap-rules.conf
# รูปแบบ: <plugin id><TAB><level><TAB><หมายเหตุ>   (level = FAIL | WARN | INFO | IGNORE)
# ============================================================

# false positive — rule matched the word "SELECT" inside a minified vendor string
# (SVG/MathML namespace in React internals), not a real code comment. ตรวจสอบแล้ว 22 ก.ย. 2026
10027	IGNORE	Information Disclosure - Suspicious Comments (false positive in minified vendor string)

# ไฟล์ static สาธารณะ (bundle ที่มี hash, robots.txt, sitemap.xml) — ตั้งใจให้แคช
# ตอนนี้ประกาศ Cache-Control ชัดเจนใน nginx.conf แล้ว (assets = immutable, HTML = no-cache)
10049	INFO	Storable and Cacheable Content (public static assets, cache policy declared in nginx)

# informational — ZAP ตรวจพบว่าเป็น SPA (module script + ไม่มีลิงก์) ไม่ต้องแก้อะไร
10109	INFO	Modern Web Application (SPA detected, no action required)

# COOP/CORP ตั้งใน nginx.conf แล้ว ส่วน COEP (require-corp) "ไม่ตั้งโดยเจตนา"
# เพราะจะทำให้ iframe ของ YouTube และ Google Maps ที่เว็บฝังอยู่โหลดไม่ได้
90004	INFO	Cross-Origin-*-Policy: COOP/CORP now set; COEP intentionally omitted for YouTube/Maps iframes
