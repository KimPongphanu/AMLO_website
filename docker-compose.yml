# ============================================================
# Docker Compose - AMLO System (Frontend + Backend + PostgreSQL)
# ============================================================
# ⚠️ IMPORTANT: Create a .env file with strong passwords before deploying!
# See .env.example for required variables.
# Without .env, defaults are UNSAFE placeholders — DO NOT USE IN PRODUCTION.
# ============================================================
name: amlo

services:
  # ── Redis Cache ──
  redis:
    image: redis:7-alpine
    container_name: amlo-redis
    restart: unless-stopped
    # 🌟 Security: ไม่เปิด port ออกภายนอก (internal network เท่านั้น) + บังคับใช้รหัสผ่าน
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD_is_required_set_it_in_.env}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 3s
      retries: 5

  # ── PostgreSQL Database ──
  postgres:
    image: postgres:16-alpine
    container_name: amlo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: backend_amlo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD_is_required_set_it_in_.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 🌟 Security: ไม่เปิด port 5432 ออกนอก — เข้าถึงได้เฉพาะ container ใน network เดียวกัน
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Express + Prisma) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amlo-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/backend_amlo
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET_is_required_generate_with_openssl_rand_-base64_48}
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY_is_required}
      # Seed credentials (required by prisma/seed.ts — set in .env)
      SEED_SUPERVISOR_EMAIL: ${SEED_SUPERVISOR_EMAIL:-}
      SEED_SUPERVISOR_PASSWORD: ${SEED_SUPERVISOR_PASSWORD:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.ethereal.email}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      NODE_ENV: production
      PORT: 8080
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
    ports:
      # 🌟 Security: bind localhost เท่านั้น — กันการยิง backend ตรงข้าม Nginx จากเครื่องอื่น
      - '127.0.0.1:8080:8080'

  # ── Frontend (Vite + Nginx) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: amlo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'
      - '443:443'

  #Prisma Studio
  prisma-studio:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amlo-prisma-studio
    restart: unless-stopped
    command: npx prisma studio --port 5555 --browser none
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/backend_amlo
    ports:
      # 🌟 Security: Prisma Studio ไม่มี auth — bind localhost เท่านั้น (เครื่องอื่นใน LAN เข้าไม่ได้)
      - '127.0.0.1:5555:5555'

# ── Persistent Volumes ──
volumes:
  postgres_data:
    name: amlo_postgres_data
  uploads:
    name: amlo_uploads
  backups:
    name: amlo_backups
  redis_data:
    name: amlo_redis_data
